services:
  - type: web
    name: pa-verstaler
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # Optioneel — kan ook via sidebar JSON worden ingevoerd
      - key: AUTH0_DOMAIN
        sync: false   # bv. jouw-naam.eu.auth0.com  (leeg laten = geen login vereist)
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: APP_URL
        value: https://pa-verstaler.onrender.com
